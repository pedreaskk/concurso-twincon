<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concurso Twincon</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Arial,sans-serif;color:#183153;background:linear-gradient(135deg,#eaf5ff,#fff3d9)}
.card{width:min(780px,100%);background:white;border-radius:28px;padding:clamp(24px,5vw,48px);box-shadow:0 14px 40px #18315320;text-align:center}.tag{display:inline-block;padding:8px 16px;border-radius:999px;background:#e8efff;color:#2454c6;font-weight:bold}
h1{font-size:clamp(30px,5vw,48px);margin:16px 0 8px}.ball{font-size:54px;margin:8px 0}.progress{font-weight:bold;color:#536783;margin:12px 0}.question{font-size:clamp(22px,3.5vw,30px);font-weight:bold;line-height:1.3;margin:24px 0}
input{width:100%;max-width:540px;padding:18px;border:3px solid #cbd8ed;border-radius:16px;font-size:22px;text-align:center;outline:none}input:focus{border-color:#2463eb}
button{border:0;border-radius:14px;padding:14px 24px;margin:14px 6px 0;font-size:18px;font-weight:bold;cursor:pointer;background:#2463eb;color:white}button.secondary{background:#e8efff;color:#2454c6}
#feedback{min-height:58px;margin-top:18px;padding:14px;border-radius:14px;font-size:20px;font-weight:bold}#feedback.good{background:#d9fbe5;color:#126534}#feedback.bad{background:#ffe0e0;color:#a21c1c}
#next{display:none;background:#159447}#finish{display:none;font-size:clamp(24px,4vw,34px);font-weight:bold;background:#d9fbe5;color:#126534;padding:24px;border-radius:18px;margin-top:20px}.hint{color:#64748b;font-size:14px;margin-top:18px}
</style></head><body><main class="card"><span class="tag">🏆 CONCURSO TWINCON</span><div class="ball">🤾‍♀️ ⚽ 🤾‍♂️</div><h1>¡A ver cuánto sabes!</h1>
<div class="progress" id="progress"></div><div class="question" id="question"></div>
<form id="quizForm"><input id="answer" autocomplete="off" placeholder="Escribe aquí tu respuesta" aria-label="Tu respuesta"><div><button type="submit" id="check">Comprobar ↵</button><button class="secondary" type="button" id="retry">Borrar respuesta</button></div></form>
<div id="feedback" aria-live="polite"></div><button type="button" id="next">Siguiente pregunta →</button><div id="finish">🎉 ¡ENHORABUENA!<br>¡HAS SUPERADO EL RETO TWINCON! 🏆</div><p class="hint">Escribe tu respuesta y pulsa INTRO. Para avanzar, primero hay que acertar.</p></main>
<script>
const questions = [["¿Quién inventó el Twincon?", ["Pau Morant", "Pau Morant Bertomeu"]], ["¿De qué colores son los equipos?", ["Azul y amarillo", "Amarillo y azul"]], ["¿Cuántas personas hay en cada equipo?", ["6", "seis", "seis jugadores", "6 jugadores"]], ["¿Pueden ser los equipos mixtos?", ["Sí", "si", "sí, pueden ser mixtos", "si pueden ser mixtos"]], ["¿Qué otro nombre tenía el juego Twincon?", ["Conos gemelos", "los conos gemelos"]]];
let current=0;const q=document.getElementById('question'),a=document.getElementById('answer'),f=document.getElementById('feedback'),progress=document.getElementById('progress'),next=document.getElementById('next'),form=document.getElementById('quizForm'),finish=document.getElementById('finish');
function norm(s){return s.trim().toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;]/g,'').replace(/\s+/g,' ')}
function showQuestion(){q.textContent=questions[current][0];progress.textContent=`PREGUNTA ${current+1} DE ${questions.length}`;a.value='';a.disabled=false;form.querySelector('button[type=submit]').disabled=false;document.getElementById('retry').disabled=false;f.className='';f.textContent='';next.style.display='none';form.style.display='block';a.focus()}
form.addEventListener('submit',e=>{e.preventDefault();if(!a.value.trim()){f.className='bad';f.textContent='Escribe una respuesta primero 🙂';return}if(questions[current][1].map(norm).includes(norm(a.value))){f.className='good';f.textContent='🎉 ¡MUY BIEN! ¡Respuesta correcta!';a.disabled=true;form.querySelector('button[type=submit]').disabled=true;document.getElementById('retry').disabled=true;next.style.display='inline-block'}else{f.className='bad';f.textContent='❌ ¡NO ES CORRECTO! ¡INTÉNTALO DE NUEVO!';a.focus();a.select()}});
document.getElementById('retry').addEventListener('click',()=>{a.value='';f.className='';f.textContent='';a.focus()});
next.addEventListener('click',()=>{current++;if(current<questions.length)showQuestion();else{form.style.display='none';q.style.display='none';progress.style.display='none';next.style.display='none';f.style.display='none';finish.style.display='block'}});
showQuestion();
</script></body></html>
